services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: papermind:latest
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - ./vector_store:/app/vector_store
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
    restart: unless-stopped

  # Live-reloading variant for local development: bind-mounts ./src over the
  # editable install baked into the `dev` build target, so host edits take
  # effect without a rebuild. Not started by `docker compose up` by default.
  #   docker compose --profile dev up api-dev
  api-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: papermind:dev
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - ./src:/app/src
      - ./vector_store:/app/vector_store
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
