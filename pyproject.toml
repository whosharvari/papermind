[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papermind"
version = "0.1.0"
description = "Production-quality RAG question-answering system over AI research papers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # RAG orchestration
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-groq>=0.2",
    # Embeddings + vector search
    "sentence-transformers>=3.2",
    "faiss-cpu>=1.9",
    # PDF ingestion
    "pypdf>=5.0",
    # LLM client (used directly by langchain-groq, pinned explicitly)
    "groq>=0.11",
    # Utilities
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",       # FastAPI test client
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/papermind"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
